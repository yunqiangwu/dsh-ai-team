# dsh-ai-team bundle layer: applied automatically when a profile lists this
# package in dsh.profile.bundles, or when passed via `dsh web --patch`.
# Users can override this row in their own profile cordis.patch.yml by id
# (the whole config is replaced, not merged).
#
# Development (run from this repository):
#   pnpm install && pnpm build
#   pnpm dsh web --patch ./cordis.patch.yml
- insert:
    - id: autopilot
      name: dsh-ai-team
      config:
        rootDir: .dsh-ai-team
        baseBranch: main
        maxMembers: 8
        maxTasks: 512
        remote:
          # git@github.com:org/repo.git or https URL; may be an EMPTY repo.
          url: ''
          # Name of the env var holding the SSH private key path / https token.
          # Never put key material in this file.
          sshKeyEnv: AUTOPILOT_GIT_KEY
          platform: generic
        bootstrap:
          enabled: true
          toolchain: [git, bun, pnpm]
          # 空串 = 跳过：默认只做工具链探测 + rootless 安装。若目标仓库有
          # 真实存在的初始化 / 自检命令，在这里指认（须命中 commandAllowlist），例如：
          #   setupCommand: pnpm install
          #   verifyCommand: pnpm run typecheck
          setupCommand: ''
          verifyCommand: ''
        gates:
          commands:
            - pnpm run typecheck
            - pnpm run lint
            - pnpm run test
            - pnpm run build
          requireCiGreen: true
          timeoutMinutes: 30
        daemon:
          maxReviewRounds: 3
          stuckMinutes: 45
          pollIntervalSeconds: 30
        escalation:
          label: needs-human
          pauseOnEscalation: task
        notification:
          enabled: true
          smtp:
            host: smtp.qq.com          # or smtp.163.com / smtp.gmail.com
            port: 465                  # 465 = implicit TLS; 587 = STARTTLS
            secure: true
            userEnv: AUTOPILOT_SMTP_USER      # env var name, never the value
            passEnv: AUTOPILOT_SMTP_PASS      # SMTP auth code, env var name only
            fromEnv: AUTOPILOT_SMTP_FROM      # optional; defaults to user
          mailTo: ops@example.com
          ticket:
            # 这个端口只服务邮件里的链接：读写都必须带 ?t=<token>（每张工单单独铸造，
            # 只出现在发给你的那份文案里，不进投影、不进日志）。未知 id 与凭据不对返回
            # **逐字节相同**的 404，所以工单号枚举不出来。
            # 非回环地址是**直接拒绝启动**，不是"反代加好鉴权就改成 0.0.0.0"的事：
            # 远程访问请走 SSH 隧道（`ssh -L 8080:127.0.0.1:<webPort>` 打通宿主 web
            # 端口就够了 —— 面板和 /autopilot/ticket 同源路由一起能用）。
            host: 127.0.0.1            # bind host for the local ticket endpoint
            port: 8080                 # 0 = ephemeral port
            # 两重语义：邮件里展示的工单根地址 + 它的 authority 被登记为面板那条同源
            # 路由（/autopilot/ticket）的可信 Host。反代换了域名就必须配它。
            publicBaseUrl: http://server.example.com   # used to build the ticket URL in email
          # 开启后，工单被答复即清除升级并把任务退回 pending、恢复无人值守循环。
          # 答复 = 替 AI 团队做决策：默认关着，先确认带 token 的那条链接只在你手里。
          autoResume: false            # answer → write back + auto-clear escalation
        deploy:
          enabled: false
        security:
          forbiddenPaths: ['LICENSE']
          commandAllowlist: [pnpm, git, bun, docker]
          pushRequiresGates: true
