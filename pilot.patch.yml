# 首跑试点 patch（dogfood：拿 dsh-ai-team 仓库自己当目标仓库）。
# 与 PILOT.md §2 模板的差异只有一处：本机没有 GITHUB_TOKEN，
# 走 generic 语义（pr_sync 纯推送、requireCiGreen 显式关——本地四件套门照跑）。
- insert:
  - id: autopilot
    name: dsh-ai-team
    config:
      rootDir: .dsh-ai-team
      baseBranch: main
      remote:
        url: git@github.com:yunqiangwu/dsh-ai-team.git
        sshKeyEnv: AUTOPILOT_GIT_KEY
        platform: generic
      bootstrap:
        enabled: true
        toolchain: [git, bun, pnpm]   # 本机已齐 → 只探测不安装
        setupCommand: pnpm install
        verifyCommand: pnpm run typecheck
      gates:
        commands: [pnpm run typecheck, pnpm run lint, pnpm run build, pnpm run test]
        requireCiGreen: false          # 无 GITHUB_TOKEN：CI 门查不到，显式关（PILOT.md §1）
        timeoutMinutes: 30
      daemon:
        maxReviewRounds: 3
        stuckMinutes: 45
        pollIntervalSeconds: 30
        maxTaskHours: 2
        maxDiffLines: 800
        maxDiffFiles: 30
      escalation:
        label: needs-human
        pauseOnEscalation: task
        webhookUrlEnv: AUTOPILOT_WEBHOOK
      deploy:
        enabled: false
      security:
        forbiddenPaths: ['LICENSE']
        commandAllowlist: [pnpm]
        pushRequiresGates: true
      learnings:
        enabled: true
